<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossfire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one CRT monitor centered on a dark desk; the canvas is the whole game, the caption is a key card underneath. */
:root {
  --desk: #121311;
  --bezel: #2a2b27;
  --bezel-edge: #3b3c36;
  --screen: #000000;
  --ink: #c9c6b8;
  --dim: #7d7b70;
  --cga-yellow: #ffff55;
  --cga-green: #55ff55;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--mono);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.monitor {
  background: var(--bezel);
  border: 1px solid var(--bezel-edge);
  border-radius: 18px;
  padding: clamp(10px, 2.4vw, 26px);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
  max-width: 100%;
  box-sizing: border-box;
}
.screen {
  position: relative;
  width: min(calc(100vw - 32px - 2 * clamp(10px, 2.4vw, 26px)), calc((100vh - 170px) * 4 / 3), 960px);
  aspect-ratio: 4 / 3;
  max-width: 100%;
  background: var(--screen);
  border-radius: 6px;
  overflow: hidden;
  cursor: text;
}
canvas {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.scan {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px);
  mix-blend-mode: multiply;
}
.focus {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.55); color: var(--cga-yellow); font-size: 14px; letter-spacing: .08em;
  text-transform: uppercase;
}
#kbd { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.keys {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
  font-size: 12px; color: var(--dim); max-width: 960px; text-align: center;
}
.keys b { color: var(--ink); font-weight: 600; }
.keys .hl b { color: var(--cga-green); }
</style>
</head>
<body>

<div class="monitor">
  <div class="screen" id="screen">
    <canvas id="cv" width="640" height="200" aria-label="Crossfire game screen"></canvas>
    <div class="scan"></div>
    <!--div class="focus" id="focus" hidden>click to focus</div-->
    <div class="focus" id="focus" hidden></div>
    <input id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="keyboard input">
  </div>
</div>
<div class="keys">
  <span class="hl"><b>cross 'name'</b> to start</span>
  <span class="hl"><b>cross robot</b> for demo</span>
  <span><b>i j k l</b> move</span>
  <span><b>e s d f</b> fire</span>
  <span><b>space</b> stop</span>
  <!--span><b>enter</b> robot mode</span>
  <span><b>0–9 + -</b> speed</span>
  <span><b>ctrl+s</b> sound</span>
  <span><b>esc</b> quit</span-->
</div>

const README_TXT = "Crossfire, (C) 1995, Peter Csurgay\n\nThis game is a public mukiware. You can use, copy, \nand distribute it with the following restrictions:\n1. All the core files are being kept together\n(readme.txt, cross.exe, cga.bgi, patterns.cro),\n2. No fee can be applied for copies and distribution.\n\nCrossfire is an implementation of the old classic\nshhot'em up game from the early days of the \ncomputer history. Different versions existed on\nR10, TRS80, ABC80 and C64.\nThis version comes with a robot being able to manage\nagainst the aliens.\nThe sound can be toggled by Ctrl-S.\n\nInformation about other mukiwares available and \ncomments are welcome at <csurgay@idt.unit.no>\n\nSincerely yours, Peter       Trondheim, 31.March 1995\n";

// ---------- IBM/BGI 8x8 font (MSB = leftmost pixel) ----------
const FONT_HEX = "00 00 00 00 00 00 00 00\n30 78 78 30 30 00 30 00\n6C 6C 6C 00 00 00 00 00\n6C 6C FE 6C FE 6C 6C 00\n30 7C C0 78 0C F8 30 00\n00 C6 CC 18 30 66 C6 00\n38 6C 38 76 DC CC 76 00\n60 60 C0 00 00 00 00 00\n18 30 60 60 60 30 18 00\n60 30 18 18 18 30 60 00\n00 66 3C FF 3C 66 00 00\n00 30 30 FC 30 30 00 00\n00 00 00 00 00 30 30 60\n00 00 00 FC 00 00 00 00\n00 00 00 00 00 30 30 00\n06 0C 18 30 60 C0 80 00\n7C C6 CE DE F6 E6 7C 00\n30 70 30 30 30 30 FC 00\n78 CC 0C 38 60 CC FC 00\n78 CC 0C 38 0C CC 78 00\n1C 3C 6C CC FE 0C 1E 00\nFC C0 F8 0C 0C CC 78 00\n38 60 C0 F8 CC CC 78 00\nFC CC 0C 18 30 30 30 00\n78 CC CC 78 CC CC 78 00\n78 CC CC 7C 0C 18 70 00\n00 30 30 00 00 30 30 00\n00 30 30 00 00 30 30 60\n18 30 60 C0 60 30 18 00\n00 00 FC 00 00 FC 00 00\n60 30 18 0C 18 30 60 00\n78 CC 0C 18 30 00 30 00\n7C C6 DE DE DE C0 78 00\n30 78 CC CC FC CC CC 00\nFC 66 66 7C 66 66 FC 00\n3C 66 C0 C0 C0 66 3C 00\nF8 6C 66 66 66 6C F8 00\nFE 62 68 78 68 62 FE 00\nFE 62 68 78 68 60 F0 00\n3C 66 C0 C0 CE 66 3E 00\nCC CC CC FC CC CC CC 00\n78 30 30 30 30 30 78 00\n1E 0C 0C 0C CC CC 78 00\nE6 66 6C 78 6C 66 E6 00\nF0 60 60 60 62 66 FE 00\nC6 EE FE FE D6 C6 C6 00\nC6 E6 F6 DE CE C6 C6 00\n38 6C C6 C6 C6 6C 38 00\nFC 66 66 7C 60 60 F0 00\n78 CC CC CC DC 78 1C 00\nFC 66 66 7C 6C 66 E6 00\n78 CC E0 70 1C CC 78 00\nFC B4 30 30 30 30 78 00\nCC CC CC CC CC CC FC 00\nCC CC CC CC CC 78 30 00\nC6 C6 C6 D6 FE EE C6 00\nC6 C6 6C 38 38 6C C6 00\nCC CC CC 78 30 30 78 00\nFE C6 8C 18 32 66 FE 00\n78 60 60 60 60 60 78 00\nC0 60 30 18 0C 06 02 00\n78 18 18 18 18 18 78 00\n10 38 6C C6 00 00 00 00\n00 00 00 00 00 00 00 FF\n30 30 18 00 00 00 00 00\n00 00 78 0C 7C CC 76 00\nE0 60 60 7C 66 66 DC 00\n00 00 78 CC C0 CC 78 00\n1C 0C 0C 7C CC CC 76 00\n00 00 78 CC FC C0 78 00\n38 6C 60 F0 60 60 F0 00\n00 00 76 CC CC 7C 0C F8\nE0 60 6C 76 66 66 E6 00\n30 00 70 30 30 30 78 00\n0C 00 0C 0C 0C CC CC 78\nE0 60 66 6C 78 6C E6 00\n70 30 30 30 30 30 78 00\n00 00 CC FE FE D6 C6 00\n00 00 F8 CC CC CC CC 00\n00 00 78 CC CC CC 78 00\n00 00 DC 66 66 7C 60 F0\n00 00 76 CC CC 7C 0C 1E\n00 00 DC 76 66 60 F0 00\n00 00 7C C0 78 0C F8 00\n10 30 7C 30 30 34 18 00\n00 00 CC CC CC CC 76 00\n00 00 CC CC CC 78 30 00\n00 00 C6 D6 FE FE 6C 00\n00 00 C6 6C 38 6C C6 00\n00 00 CC CC CC 7C 0C F8\n00 00 FC 98 30 64 FC 00\n1C 30 30 E0 30 30 1C 00\n18 18 18 00 18 18 18 00\nE0 30 30 1C 30 30 E0 00\n76 DC 00 00 00 00 00 00";
const FONT = new Array(256).fill(null);
FONT_HEX.split('\n').forEach((l, n) => { FONT[32 + n] = l.trim().split(/\s+/).map(h => parseInt(h, 16)); });
FONT[178] = [0xDB, 0x77, 0xDB, 0xEE, 0xDB, 0x77, 0xDB, 0xEE]; // ▓
function charCode(ch) {
  if (ch === '▓') return 178;
  const c = ch.charCodeAt(0);
  return (c >= 32 && c < 127) ? c : 63;
}

// ---------- display ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let mode = 'text';
const PAL = [[0, 0, 0], [0x55, 0xFF, 0x55], [0xFF, 0x55, 0x55], [0xFF, 0xFF, 0x55]]; // CGAC0
const gfx = new Uint8Array(320 * 200);
let imgGfx = ctx.createImageData(320, 200);
let imgTxt = ctx.createImageData(640, 200);

// ---------- text mode (80x25, CGA 8x8 cells) ----------
const TW = 80, TH = 25;
const tbuf = new Uint8Array(TW * TH).fill(32);
let tcx = 0, tcy = 0, showCursor = true;
function tscroll() { tbuf.copyWithin(0, TW); tbuf.fill(32, TW * (TH - 1)); tcy = TH - 1; }
function tputc(ch) {
  if (ch === '\n') { tcx = 0; tcy++; }
  else if (ch === '\t') { do { tputc(' '); } while (tcx % 8 !== 0); return; }
  else { tbuf[tcy * TW + tcx] = charCode(ch); tcx++; if (tcx >= TW) { tcx = 0; tcy++; } }
  if (tcy >= TH) tscroll();
}
function twrite(s) { for (const ch of s) tputc(ch); }
function twriteln(s = '') { twrite(s); tputc('\n'); }
function tcls() { tbuf.fill(32); tcx = 0; tcy = 0; }
function tbackspace() { if (tcx > 0) { tcx--; tbuf[tcy * TW + tcx] = 32; } }

function present(now) {
  if (mode === 'gfx') {
    if (cv.width !== 320) { cv.width = 320; }
    const d = imgGfx.data;
    for (let i = 0, p = 0; i < gfx.length; i++, p += 4) {
      const c = PAL[gfx[i]]; d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = 255;
    }
    ctx.putImageData(imgGfx, 0, 0);
  } else {
    if (cv.width !== 640) { cv.width = 640; }
    const d = imgTxt.data;
    d.fill(0);
    const blink = Math.floor(now / 266) % 2 === 0;
    for (let row = 0; row < TH; row++) for (let col = 0; col < TW; col++) {
      const g = FONT[tbuf[row * TW + col]];
      const cursorHere = showCursor && blink && row === tcy && col === tcx;
      for (let y = 0; y < 8; y++) {
        let bits = g ? g[y] : 0;
        if (cursorHere && y >= 6) bits = 0xFF;
        if (!bits) continue;
        let p = ((row * 8 + y) * 640 + col * 8) * 4;
        for (let x = 0; x < 8; x++, p += 4) if (bits & (0x80 >> x)) { d[p] = d[p + 1] = d[p + 2] = 0xAA; }
      }
    }
    for (let p = 3; p < d.length; p += 4) d[p] = 255;
    ctx.putImageData(imgTxt, 0, 0);
  }
}
(function loop(t) { present(t || 0); requestAnimationFrame(loop); })();

// ---------- BGI emulation ----------
let curColor = 3, writeMode = 0, hjust = 0; // hjust: 0 left, 1 center
const lefttext = 0, centertext = 1;
function setcolor(c) { curColor = c; }
function setwritemode(m) { writeMode = m; }
function settextjustify(h) { hjust = h; }
function cleardevice() { gfx.fill(0); }
function putpixel(x, y, c) { if (x >= 0 && x < 320 && y >= 0 && y < 200) gfx[y * 320 + x] = c; }
function linepix(x, y) {
  if (x < 0 || x >= 320 || y < 0 || y >= 200) return;
  const i = y * 320 + x;
  if (writeMode === 1) gfx[i] ^= curColor; else gfx[i] = curColor;
}
function line(x1, y1, x2, y2) {
  let dx = Math.abs(x2 - x1), dy = -Math.abs(y2 - y1);
  const sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    linepix(x1, y1);
    if (x1 === x2 && y1 === y2) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x1 += sx; }
    if (e2 <= dx) { err += dx; y1 += sy; }
  }
}
function rectangle(x1, y1, x2, y2) { line(x1, y1, x2, y1); line(x2, y1, x2, y2); line(x2, y2, x1, y2); line(x1, y2, x1, y1); }
function putimage(x, y, img, m) {
  for (let iy = 0; iy < img.h; iy++) {
    const yy = y + iy; if (yy < 0 || yy >= 200) continue;
    for (let ix = 0; ix < img.w; ix++) {
      const xx = x + ix; if (xx < 0 || xx >= 320) continue;
      const v = img.d[iy * img.w + ix], k = yy * 320 + xx;
      if (m === 1) gfx[k] ^= v; else gfx[k] = v;
    }
  }
}
function outtextxy(x, y, s) {
  const x0 = hjust === centertext ? x - Math.trunc(s.length * 8 / 2) : x;
  for (let n = 0; n < s.length; n++) {
    const g = FONT[charCode(s[n])]; if (!g) continue;
    for (let yy = 0; yy < 8; yy++) for (let xx = 0; xx < 8; xx++)
      if (g[yy] & (0x80 >> xx)) putpixel(x0 + n * 8 + xx, y + yy, curColor);
  }
}

// ---------- keyboard (BIOS-like buffer) ----------
const keyBuf = [];
let keyWaiter = null;
function pushKey(k) {
  if (keyBuf.length < 15) keyBuf.push(k);
  if (keyWaiter) { const w = keyWaiter; keyWaiter = null; w(); }
}
function keypressed() { return keyBuf.length > 0; }
function readkeyNow() { return keyBuf.shift(); }
async function readkey() {
  while (!keyBuf.length) await new Promise(r => { keyWaiter = r; });
  return keyBuf.shift();
}
function flushKeys() { keyBuf.length = 0; }
const kbd = document.getElementById('kbd');
function keyToken(e) {
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.key && e.key.toLowerCase() === 's') return '\x13';
  if (e.ctrlKey || e.metaKey || e.altKey) return null;
  switch (e.key) {
    case 'Enter': return '\r';
    case 'Escape': return '\x1b';
    case 'Backspace': return '\b';
    case 'ArrowUp': return 'UP';
    case 'ArrowDown': return 'DOWN';
    case 'ArrowLeft': return 'LEFT';
    case 'ArrowRight': return 'RIGHT';
  }
  if (e.key && e.key.length === 1) return e.key;
  return null;
}
window.addEventListener('keydown', e => {
  audioInit();
  const t = keyToken(e);
  if (t === null) return;
  e.preventDefault();
  pushKey(t);
});
kbd.addEventListener('input', () => { // on-screen keyboards that send no key codes
  for (const ch of kbd.value) pushKey(ch);
  kbd.value = '';
});
const screenEl = document.getElementById('screen');
const focusEl = document.getElementById('focus');
screenEl.addEventListener('pointerdown', () => { audioInit(); setTimeout(() => kbd.focus({ preventScroll: true }), 0); });
function updateFocus() { focusEl.hidden = document.hasFocus(); }
window.addEventListener('focus', updateFocus);
window.addEventListener('blur', updateFocus);
setTimeout(updateFocus, 300);

// ---------- PC speaker ----------
let ac = null, osc = null, gain = null;
const VOL = 0.06;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    osc = ac.createOscillator(); osc.type = 'square';
    gain = ac.createGain(); gain.gain.value = 0;
    osc.connect(gain).connect(ac.destination); osc.start();
  } catch (e) { ac = null; }

      else if (ch === '5') { needdelay = 80; cheated = true; }
      else if (ch === '6') { needdelay = 160; cheated = true; }
      else if (ch === '7') { needdelay = 320; cheated = true; }
      else if (ch === '8') { needdelay = 640; cheated = true; }
      else if (ch === '9') { needdelay = 3000; cheated = true; }
      else if (ch === '*') { needdelay = defaultneeddelay; }
      else if (ch === '+') { if (needdelay > 0) needdelay--; }
      else if (ch === '-') { if (needdelay < 10000) needdelay++; cheated = true; }
      else if (ch === '\x13') { needsound = !needsound; }
      if (ch === '\x1b') autopilot = false; else ch = '|';

      // AMMO
      r = random(2);
      if (ammo <= 10 && newammopos) {
        newammopos = false; ammosound = 5000; ammosounddir = 1;
        if (r === 0) { ax = (random(6)+1)*(dh+d1); ay = random(4*(dv+d1)) + dv + d1; }
        else { ax = random(5*(dh+d1)) + dh + d1; ay = (random(5)+1)*(dv+d1); }
      }
      if (ammo <= 10) {
        putimage(lb+ax, ay, IAM, 1);
        if (ammosound % 200 === 0) { if (needsound) spk(ammosound, 5); }
        ammosound += ammosounddir * 20;
        if (ammosound <= 5000) ammosounddir = 1;
        if (ammosound >= 6000) ammosounddir = -1;
      }

      // BONUS
      if (isbonus) putimage(lb+bonox[bonus], bonoy[bonus], IBO, 1);
      if (swallowdelay > 0) {
        setwritemode(1);
        putimage(lb+bonox[bonus]-d2, bonoy[bonus], IEM, 0);
        putimage(lb+bonox[bonus]+d2-1, bonoy[bonus], IEM, 0);
        outtextxy(lb+bonox[bonus]+d2, bonoy[bonus]+2, bonst[bonus]);
        putimage(lb+spx, spy, ISH, 0);
        setwritemode(0);
        swallowdelay--;
        if (swallowdelay === 0) {
          putimage(lb+bonox[bonus]-d2, bonoy[bonus], IEM, 0);
          putimage(lb+bonox[bonus]+d2-1, bonoy[bonus], IEM, 0);
          putimage(lb+spx, spy, ISH, 0);
        }
      }

      // EXPLOSIONS (Pascal for: upper bound evaluated once)
      for (let i = 1, hi = nx; i <= hi; i++) {
        putimage(lb+xpx[i], xpy[i], IX[xt[i]], 1);
        xd[i]--;
        if (xd[i] === 0) {
          putimage(lb+xpx[i], xpy[i], IEM, 0);
          putimage(lb+spx, spy, ISH, 0);
          clearexplosion();
        }
      }

      // SHIP: NEW VELOCITY VECTOR
      if (isx + isy < 2) {
        if ((isy !== 0 && spx % (d1+dh) === 0) || (isx !== 0 && spy % (d1+dv) === 0) ||
            (spx % (d1+dh) === 0 && spy % (d1+dv) === 0)) {
          svx = isx; svy = isy; isx = 17; isy = 17;
        }
      }

      // SHIP: MOVES
      if (svx + svy !== 0) {
        if (spx + svx < d1+dh || spx + svx > 6*(d1+dh)) svx = 0;
        else if (spy + svy < d1+dv || spy + svy > 5*(d1+dv)) svy = 0;
        else {
          spx += svx; spy += svy; putimage(lb+spx, spy, ISH, 0);
          if (ammo <= 10 && Math.abs(spx-ax) < d1 && Math.abs(spy-ay) < d1) {
            putimage(lb+ax, ay, IEM, 0);
            putimage(lb+spx, spy, ISH, 0);
            ammo = maxammo; newammopos = true;
            if (needsound) spk(1500, 12, 2500);
          }
          if (isbonus && Math.abs(spx-bonox[bonus]) < d1 && Math.abs(spy-bonoy[bonus]) < d1) {
            score += bonbo[bonus];
            swallowdelay = 50;
            lastallfires = allfires;
            isbonus = false;
            if (needsound) spk(1500, 12, 2500);
            standing();
          }
        }
      }

      // SHIP: TRY TO FIRE
      if (ifx + ify < 2 && ammo > 0) {
        if (((ifx === 0 && spx % (d1+dh) === 0) || (ify === 0 && spy % (d1+dv) === 0)) && fvx + fvy === 0) {
          fvx = ifx; fvy = ify; ifx = 17; ify = 17;
          fpx = spx + d2 + fvx*d2; fpy = spy + d2 + fvy*d2;
          ammo--; allfires++;
          if (allfires === lastallfires + 12) {
            isbonus = !isbonus;
            if (isbonus) bonus++;
            if (bonus > 4) isbonus = false;
            lastallfires = allfires;
            if (isbonus) {
              putimage(lb+bonix[bonus], boniy[bonus], IEM, 0);
              if (needsound) spk(3000, 12, 4000);
            } else if (bonus < 5) {
              putimage(lb+bonox[bonus], bonoy[bonus], IEM, 0);
              putimage(lb+spx, spy, ISH, 0);
              putimage(lb+bonix[bonus], boniy[bonus], IBO, 0);
            }
          }
        }
      }

      // SHIP: FIRE MOVES
      if (fvx + fvy !== 0) {
        i = 1; bingo = false;
        do {
          if (nen > 0 && Math.abs(epx[i]+d2-fpx) <= d2 && Math.abs(epy[i]+d2-fpy) < d2) {
            score += escores[el[i]]; standing(); await kill(i); bingo = true;
          }
          i++;
        } while (!(i > nen || bingo));
        if (bingo || fpx < d1 || fpx >= 7*(d1+dh) || fpy < d1 || fpy > 5*(d1+dv)+d1) {
          setcolor(0); line(lb+fpx, fpy, lb+fpx+14*fvx, fpy+14*fvy); setcolor(3);
          fvx = 0; fvy = 0; actshot = false;
        } else {
          line(lb+fpx+7*fvx, fpy+7*fvy, lb+fpx+14*fvx, fpy+14*fvy);
          setcolor(0); line(lb+fpx, fpy, lb+fpx+6*fvx, fpy+6*fvy); setcolor(3);
        }
        fpx += 7*fvx; fpy += 7*fvy;
      }

      // BULLETS (Pascal for: upper bound evaluated once)
      for (let i = 1, hi = nbul; i <= hi; i++) {
        if (Math.abs(spx+d2-bpx[i]) < d2 && Math.abs(spy+d2-bpy[i]) < d2) died = true;
        if (bpx[i] < d1 || bpx[i] > 7*(d1+dh) || bpy[i] < d1 || bpy[i] > 5*(d1+dv)) {
          setcolor(0);
          line(lb+bpx[i]-bvx[i], bpy[i]-bvy[i], lb+bpx[i]+(2+3*bspeed)*bvx[i], bpy[i]+(2+3*bspeed)*bvy[i]);
          setcolor(3);
          for (let j = i; j <= nbul - 1; j++) { bpx[j] = bpx[j+1]; bpy[j] = bpy[j+1]; bvx[j] = bvx[j+1]; bvy[j] = bvy[j+1]; }
          nbul--; showns();
        } else {
          line(lb+bpx[i]+bvx[i], bpy[i]+bvy[i], lb+bpx[i]+(2+3*bspeed)*bvx[i], bpy[i]+(2+3*bspeed)*bvy[i]);
          setcolor(0);
          line(lb+bpx[i]-bvx[i], bpy[i]-bvy[i], lb+bpx[i]+bspeed*bvx[i], bpy[i]+bspeed*bvy[i]);
          setcolor(3);
        }
        bpx[i] += bspeed*bvx[i]; bpy[i] += bspeed*bvy[i];
      }

      // ENEMIES
      if (nen > 0) {
        // ENEMIES: START MOVING
        i = random(nen) + 1;
        if (evx[i] + evy[i] === 0 && (nmen < maxnmen + 1*level || est[i] > 0)) {
          if (est[i] === 0) {
            nmen++; evx[i] = es1x[i]; evy[i] = es1y[i]; est[i] = 1;
          } else {
            ewait[i]--;
            r = random(4);
            if (ewait[i] === 0 || nen <= maxnmen + 1*level) {
              if (r > 0 || nen <= maxnmen + 1*level) { evx[i] = es2x[i]; evy[i] = es2y[i]; est[i] = 2; }
              else { evx[i] = -es1x[i]; evy[i] = -es1y[i]; }
            }
          }
        }

        // ENEMIES: MOVE
        if (edelay === 0) for (i = 1; i <= nen; i++) {
          // DELAY OF NEXT BULLET
          if (dbullet[i] === 0) r = random(100); else { r = 101; dbullet[i]--; }

          // MOVE, JAM?
          if (est[i] > 0) {
            epx[i] += evx[i]; epy[i] += evy[i];
            jam = false;
            for (j = 1; j <= nen; j++) {
              if (j !== i && Math.abs(epx[i]-epx[j]) < d1 && Math.abs(epy[i]-epy[j]) < d1) {
                jam = true;
                epx[i] -= evx[i]; epy[i] -= evy[i];
                if (epx[i] >= dh+d1 && epx[i] <= 7*(dh+d1)-dv && epy[i] >= dv+d1 && epy[i] <= 6*(dv+d1)-dv) {
                  evx[i] = -evx[i]; evy[i] = -evy[i];
                }
              }
            }
            putimage(lb+epx[i], epy[i], IE[el[i]], 0);

            dx = sgn(spx-epx[i]); dy = sgn(spy-epy[i]);

            if ((epx[i] % (d1+dh) === 0 || epy[i] % (d1+dv) === 0) && nbul < maxbullets + 2*level && est[i] === 2) {
              if (r < pbullet[el[i]] + 0*level) {
                dbullet[i] = mindbullet[el[i]] - 0*level;
                nbul++; showns();
                if (epx[i] % (d1+dh) !== 0) dy = 0;
                if (epy[i] % (d1+dv) !== 0) dx = 0;
                if (dx !== 0 && dy !== 0) { r = random(2); if (r === 0) dx = 0; else dy = 0; }
                bvx[nbul] = dx; bvy[nbul] = dy;
                bpx[nbul] = epx[i] + d2 + dx*d2; bpy[nbul] = epy[i] + d2 + dy*d2;
              }
            }

            if (!jam) {
              // IF JUST ARRIVED BACK TO ITS STARTING POSITION
              if (epx[i] === espx[i] && epy[i] === espy[i]) { nmen--; est[i] = 0; evx[i] = 0; evy[i] = 0; }
              if (Math.abs(spx-epx[i]) < dd && Math.abs(spy-epy[i]) < dd) died = true;
              if (epx[i] % (d1+dh) === 0 && epy[i] % (d1+dv) === 0) {
                if (est[i] === 1) { evx[i] = 0; evy[i] = 0; ewait[i] = random(5); }
                else {
                  evx[i] = sgn(spx-epx[i]);
                  evy[i] = sgn(spy-epy[i]);
                  if (evx[i] !== 0 && evy[i] !== 0) { r = random(2); if (r === 0) evx[i] = 0; else evy[i] = 0; }
                }
              }
            }
          }
        }
      }

      if (nen === 0) alone--;

      // DIED
      if (died) {
        for (let i = 1; i <= 5; i++) {
          putimage(lb+spx, spy, IX[actxt], 0);
          actxt = 3 - actxt;
          await delay(300);
        }
        await delay(500);
        lives--; standing();
        if (lives > 0) {
          died = false;
          nmen = 0;
          ammo = maxammo; newammopos = true;
          for (let i = 1; i <= nen; i++) {
            putimage(lb+epx[i], epy[i], IEM, 0);
            epx[i] = espx[i]; epy[i] = espy[i]; est[i] = 0; evx[i] = 0; evy[i] = 0;
          }
          putimage(lb+spx, spy, IEM, 0);
          putimage(lb+ax, ay, IEM, 0);
          setcolor(0);
          for (let i = 1; i <= nbul; i++) line(lb+bpx[i], bpy[i], lb+bpx[i]+5*bvx[i], bpy[i]+5*bvy[i]);
          setcolor(3);
          nbul = 0; showns();
          for (let i = 1; i <= nen; i++) putimage(lb+epx[i], epy[i], IE[el[i]], 0);
          initship();
          nde = 0; actshot = false;
        }
      }
    } while (!(ch === '\x1b' || died || (nen === 0 && alone === 0)));
    if (nen === 0) level++;
    standing();
    if (died || nen === 0) await delay(2000);
  } while (!(ch === '\x1b' || died));

  const now = new Date();
  appendHistory((now.getMonth()+1) + '.' + now.getDate() + '. ' + now.getHours() + ':' + now.getMinutes() +
    '\t' + name + ':' + score + (cheated ? ' (cheated)' : '') + (died ? '' : ' (aborted)'));
  flushKeys();
  if (died && !autopilot) await readkey();
  flushKeys();
  // closegraph
  mode = 'text'; showCursor = true; tcls();
}

// =====================================================================
//                     a tiny DOS prompt around it
// =====================================================================
const FILES = [
  ['CROSS', 'EXE', 31422], ['CGA', 'BGI', 6253], ['PATTERNS', 'CRO', 6250],
  ['HISTORY', 'CRO', null], ['README', 'TXT', 738]
];
async function readLine(hist) {
  let s = '', hp = hist.length;
  for (;;) {
    const k = await readkey();
    if (k === '\r') { twriteln(); return s; }
    if (k === '\b') { if (s.length) { s = s.slice(0, -1); tbackspace(); } continue; }
    if (k === '\x1b') { while (s.length) { s = s.slice(0, -1); tbackspace(); } continue; }
    if (k === 'UP' || k === 'DOWN') {
      if (!hist.length) continue;
      hp = k === 'UP' ? Math.max(0, hp - 1) : Math.min(hist.length, hp + 1);
      while (s.length) { s = s.slice(0, -1); tbackspace(); }
      s = hp < hist.length ? hist[hp] : ''; twrite(s);
      continue;
    }
    if (k.length === 1 && k >= ' ' && k <= '~' && s.length < 60) { s += k; twrite(k); }
  }
}
function typeFile(text) { for (const l of text.replace(/\n$/, '').split('\n')) twriteln(l); }
async function run(cmdline) {
  const parts = cmdline.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return;
  const cmd = parts[0].toLowerCase(), args = parts.slice(1);
  if (cmd === 'cross' || cmd === 'cross.exe') { await cross(args); return; }
  if (cmd === 'cls') { tcls(); return; }
  if (cmd === 'ver') { twriteln(); twriteln('MS-DOS Version 6.22'); twriteln(); return; }
  if (cmd === 'dir') {
    twriteln(); twriteln(' Volume in drive C is CROSSFIRE'); twriteln(' Directory of C:\\CROSS'); twriteln();
    twriteln('.            <DIR>        03-31-95  12:00a');
    twriteln('..           <DIR>        03-31-95  12:00a');
    for (const [n, e, sz] of FILES) {
      const size = sz === null ? historyMem.replace(/\n/g, '\r\n').length : sz;
      twriteln(n.padEnd(9) + e.padEnd(4) + String(size).padStart(10) + ' 03-31-95  12:00a');
    }
    twriteln('        5 file(s)'); twriteln();
    return;
  }
  if (cmd === 'type') {
    const f = (args[0] || '').toLowerCase();
    if (f === 'history.cro') typeFile(historyMem);
    else if (f === 'readme.txt') typeFile(README_TXT);
    else if (f === 'patterns.cro') typeFile(PATTERNS_CRO.replace(/##/g, '▓▓'));
    else if (!f) twriteln('Required parameter missing');
    else twriteln('File not found - ' + args[0].toUpperCase());
    return;
  }
  if (cmd === 'help') {
    twriteln('cross <name> [delay]   play  (cross robot = autopilot, delay 20 = normal)');
    twriteln('type history.cro       all past games');
    twriteln('type readme.txt        the 1995 readme');
    twriteln('dir, cls, ver');
    return;
  }
  twriteln('Bad command or file name');
}
async function shell() {
  twriteln('Crossfire (C) 1995 Peter Csurgay  -  Turbo Pascal to HTML5 canvas port');
  twriteln();
  twriteln('  cross <name>         play, e.g.  cross peti');
  twriteln('  cross robot          watch the robot play');
  twriteln('  type history.cro     earlier games          help   more commands');
  twriteln();
  const hist = [];
  for (;;) {
    twrite('C:\\CROSS>');
    const line = await readLine(hist);
    if (line.trim()) hist.push(line);
    try { await run(line); }
    catch (e) { mode = 'text'; showCursor = true; twriteln('Runtime error: ' + e.message); }
  }
}
shell();
</script>
